name: CI/CD Docker Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    steps:
            - name: Checkout code
        uses: actions/checkout@v4

            - name: Run Tests
        run: |
          npm install
          npm test

            - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cicd-static-app:latest

  deploy-local-info:
    needs: test-build-push
    runs-on: ubuntu-latest
    steps:
            - name: Deployment Ready
        run: echo "Image pushed! Pull on Minikube: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cicd-static-app:latest"
